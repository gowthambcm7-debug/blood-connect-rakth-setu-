<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RaktaSetu — Blood, closer to help</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#b51f3a;--red2:#8f1730;--ink:#18202c;--muted:#657184;--paper:#f6f7f9;--white:#fff;--line:#e1e5eb;--green:#168156;--amber:#a45b00;--blue:#365bd6;--shadow:0 18px 44px rgba(24,32,44,.08);--round:18px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.03em}button,input,select{font:inherit}button{cursor:pointer}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{max-width:1080px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink);text-align:left}.mark{width:38px;height:38px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:20px}.brand b{font:700 17px 'Space Grotesk';display:block}.brand small{font-size:11px;color:var(--muted)}.navright{display:flex;gap:8px;align-items:center}.shell{max-width:1000px;margin:auto;padding:0 24px}.hero{padding:54px 0 28px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}.eyebrow{color:var(--red);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:clamp(38px,6vw,62px);line-height:1.02;margin:13px 0 16px;max-width:590px}.lead{color:var(--muted);line-height:1.7;font-size:16px;max-width:560px}.hero-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.stat:last-child{border:0}.stat span{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:30px;padding:7px 11px;background:#fce9ed;color:var(--red);font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 48px}.tile{background:#fff;border:1px solid var(--line);border-radius:var(--round);padding:21px;min-height:173px;cursor:pointer;transition:.15s}.tile:hover{transform:translateY(-3px);border-color:#d58a99;box-shadow:var(--shadow)}.tile .icon{font-size:22px}.tile h3{font-size:18px;margin:13px 0 8px}.tile p{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:var(--round);padding:24px;margin:28px auto;box-shadow:0 5px 20px rgba(24,32,44,.03)}.narrow{max-width:620px}.title{font-size:25px;margin-bottom:5px}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 19px}.field{margin:0 0 15px}.field label{display:block;font-size:12px;font-weight:700;color:#4a5667;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #d7dce4;background:#fbfcfd;border-radius:10px;padding:12px 13px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 3px #f9e4e9}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:var(--red);color:#fff;width:100%}.primary:hover{background:var(--red2)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.small{font-size:12px;padding:8px 11px}.accept{background:var(--green);color:#fff}.reject{background:#fff;border:1px solid var(--line)}.link{border:0;background:none;padding:0;color:var(--red);font-weight:700}.error{padding:11px 13px;background:#fff0f2;color:var(--red2);border:1px solid #f3c6cf;border-radius:10px;margin:12px 0;font-size:13px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.section{margin:30px 0 12px;display:flex;justify-content:space-between;align-items:center}.section h2{font-size:22px}.alert{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.alert strong{font-size:14px}.meta{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}.status{font-size:11px;font-weight:700;border-radius:20px;background:#eef1f5;padding:5px 9px;text-transform:uppercase;letter-spacing:.04em}.status-accepted,.status-confirmed{background:#e1f5e9;color:var(--green)}.status-declined,.status-expired{background:#f3ecee;color:#80515b}.status-pending{background:#fff2de;color:var(--amber)}.badge{font-size:11px;color:var(--red);background:#fae8ec;border-radius:12px;padding:4px 8px}.empty{border:1px dashed #cdd3dc;padding:30px 16px;text-align:center;color:var(--muted);border-radius:14px;background:#fff}.alertbox{position:relative}.bell{position:relative}.dot{position:absolute;right:2px;top:1px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1px solid white}.dropdown{position:absolute;right:24px;top:65px;width:min(390px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:12px;z-index:9}.note{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.note:last-child{border:0}.note.unread{background:#fff8f9}.note b{font-size:13px}.note p{font-size:12px;line-height:1.5;color:var(--muted);margin:5px 0}.note small{font-size:10px;color:var(--muted)}.footer{padding:32px 0 45px;text-align:center;color:var(--muted);font-size:12px}.divider{height:1px;background:var(--line);margin:17px 0}.locrow{display:grid;grid-template-columns:1fr auto;gap:8px}.hidden{display:none!important}@media(max-width:730px){.hero{grid-template-columns:1fr;padding-top:38px}.grid{grid-template-columns:1fr}.tile{min-height:auto}.row{grid-template-columns:1fr}.shell{padding:0 17px}.nav{padding:12px 15px}.hero h1{font-size:42px}.card{padding:20px}.dropdown{right:10px}}
</style>
</head><body><div id="app"><div class="shell" style="padding-top:55px;color:#657184">Loading RaktaSetu…</div></div>
<script>
const groups=['O-','O+','A-','A+','B-','B+','AB-','AB+'];
const cities=[['Warangal, Telangana',17.9689,79.5941],['Hanamkonda, Telangana',18.0002,79.5800],['Hyderabad, Telangana',17.3850,78.4867],['Khammam, Telangana',17.2473,80.1514],['Karimnagar, Telangana',18.4386,79.1288],['Nizamabad, Telangana',18.6725,78.0941],['Vijayawada, Andhra Pradesh',16.5062,80.6480],['Bengaluru, Karnataka',12.9716,77.5946]];
const state={view:'home',account:null,requestId:null,notices:[],noticeOpen:false,items:[],loading:false};let poll=null;
const api=async(path,opts={})=>{const res=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let body={};try{body=await res.json()}catch{}if(!res.ok)throw new Error(body.error||'Request failed');return body};
const esc=x=>{const d=document.createElement('span');d.textContent=x??'';return d.innerHTML};
const groupOptions=(selected='O+')=>groups.map(g=>'<option '+(g===selected?'selected':'')+'>'+g+'</option>').join('');
const cityOptions='<option value="">Choose a sample location…</option>'+cities.map(c=>'<option value="'+esc(c[0])+'">'+esc(c[0])+'</option>').join('');
function stopPoll(){if(poll){clearInterval(poll);poll=null}}
function nav(){const a=state.account;return '<header class="top"><div class="nav"><button class="brand" id="home"><span class="mark">🩸</span><span><b>RaktaSetu</b><small>Blood, closer to help · 20 km network</small></span></button><div class="navright">'+(a?'<button class="btn ghost small" id="notify">🔔 Notifications '+(state.notices.some(n=>!n.is_read)?'<i class="dot"></i>':'')+'</button><button class="btn ghost small" id="dashboard">'+esc(a.name.split(' ')[0])+' · '+roleName(a.role)+'</button><button class="btn ghost small" id="logout">Sign out</button>':'<button class="btn ghost small" id="login">Sign in</button><button class="btn primary small" id="register">Create account</button>')+'</div></div>'+(state.noticeOpen&&a?'<div class="dropdown"><div style="padding:7px 9px;font-weight:700">Notifications <span class="hint">· '+state.notices.length+'</span></div>'+(state.notices.length?state.notices.map(n=>'<div class="note '+(!n.is_read?'unread':'')+'" data-note="'+n.id+'"><b>'+esc(n.title)+'</b><p>'+esc(n.body)+'</p><small>'+new Date(n.created_at).toLocaleString()+' · Email: '+esc(n.email_status)+'</small></div>').join(''):'<div class="empty">No notifications yet.</div>')+'</div>':'')+'</header>'}
function roleName(r){return ({donor:'Donor',nss_volunteer:'NSS volunteer',blood_bank:'Blood bank',patient:'Patient'})[r]||r}
function footer(){return '<footer class="footer">RaktaSetu · SPO matching ranks compatible, available donors by distance. This service coordinates contact; it does not provide medical advice. In an emergency, contact your hospital or local emergency services.</footer>'}
function homeView(){return '<main class="shell"><section class="hero"><div><span class="eyebrow">RaktaSetu · NSS Blood Network</span><h1>When blood is needed, distance matters.</h1><p class="lead">Connect patients, hospitals, blood banks, donors and NSS volunteers. SPO finds the closest available compatible donors within 20 km and shares the request through in-app alerts and email when configured.</p><span class="pill">● 20 km · Blood-compatible · Nearest first</span></div><aside class="hero-card"><h3 style="font-size:19px;margin-bottom:8px">How the response loop works</h3><div class="stat"><b>01 · Match</b><span>SPO checks group + location</span></div><div class="stat"><b>02 · Alert</b><span>Nearest donor gets the first alert</span></div><div class="stat"><b>03 · Confirm</b><span>25 min to confirm on the way</span></div><div class="stat"><b>04 · Escalate</b><span>Next donors are notified if needed</span></div><p class="hint">Email requires SendGrid configuration by the deployer. Notifications remain available in the project bar.</p></aside></section><div class="grid"><div class="tile" data-go="register"><span class="icon">🩸</span><h3>Donate blood</h3><p>Join as a donor or NSS volunteer and receive nearby, compatible requests.</p></div><div class="tile" data-go="request"><span class="icon">🏥</span><h3>Request blood</h3><p>Patients and blood banks can publish a request and follow donor responses.</p></div><div class="tile" data-go="login"><span class="icon">🔐</span><h3>Sign in</h3><p>Use your email and password to manage your account and notifications.</p></div></div></main>'+footer()}
function locFields(prefix){return '<div class="field"><label>Area or location name</label><input id="'+prefix+'-loc" required placeholder="Hospital, neighborhood or landmark"></div><div class="field"><label>Choose a city (optional)</label><select id="'+prefix+'-city">'+cityOptions+'</select></div><div class="row"><div class="field"><label>Latitude</label><input id="'+prefix+'-lat" type="number" step="any" required placeholder="17.9689"></div><div class="field"><label>Longitude</label><input id="'+prefix+'-lng" type="number" step="any" required placeholder="79.5941"></div></div><button type="button" class="btn ghost small" id="'+prefix+'-geo">📍 Use my current location</button><p class="hint">Location is used only to find donors within 20 km. Use the browser location prompt or enter coordinates.</p>'}
function bindLoc(prefix){const city=document.getElementById(prefix+'-city');if(city)city.onchange=()=>{const c=cities.find(x=>x[0]===city.value);if(c){document.getElementById(prefix+'-loc').value=c[0];document.getElementById(prefix+'-lat').value=c[1];document.getElementById(prefix+'-lng').value=c[2]}};const geo=document.getElementById(prefix+'-geo');if(geo)geo.onclick=()=>{if(!navigator.geolocation){alert('Browser location is unavailable. Enter coordinates.');return}geo.textContent='Locating…';navigator.geolocation.getCurrentPosition(p=>{document.getElementById(prefix+'-lat').value=p.coords.latitude;document.getElementById(prefix+'-lng').value=p.coords.longitude;if(!document.getElementById(prefix+'-loc').value)document.getElementById(prefix+'-loc').value='Current location';geo.textContent='📍 Use my current location'},()=>{geo.textContent='📍 Use my current location';alert('Location access failed. Enter coordinates manually.')},{enableHighAccuracy:true,timeout:12000})}}
function registerView(){return '<main class="shell"><section class="card narrow"><button class="link" data-home>← Back</button><h2 class="title" style="margin-top:18px">Create your account</h2><p class="sub">Email and password sign-in for donors, NSS volunteers, patients and blood banks.</p><div id="form-error"></div><form id="reg-form"><div class="field"><label>Account type</label><select id="role"><option value="donor">Blood donor</option><option value="nss_volunteer">NSS volunteer</option><option value="patient">Patient / attendant</option><option value="blood_bank">Blood bank</option></select></div><div class="field"><label>Name or organization</label><input required id="name" maxlength="120" placeholder="Your full name / blood bank name"></div><div class="row"><div class="field"><label>Email</label><input required type="email" id="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Mobile</label><input required id="mobile" autocomplete="tel" placeholder="+91…"></div></div><div class="field"><label>Password (8+ characters)</label><input required type="password" id="password" minlength="8" autocomplete="new-password"></div><div id="donor-fields"><div class="row"><div class="field"><label>Blood group</label><select id="blood">'+groupOptions()+'</select></div><div class="field"><label>Platelet count (optional)</label><input id="platelet" type="number" min="0" placeholder="e.g. 250000"></div></div>'+locFields('reg')+'</div><button class="btn primary" style="margin-top:14px">Create account</button></form><p class="hint">Passwords are stored as secure hashes, never as plain text.</p></section></main>'+footer()}
function loginView(){return '<main class="shell"><section class="card narrow"><button class="link" data-home>← Back</button><h2 class="title" style="margin-top:18px">Sign in</h2><p class="sub">Use your account email and password.</p><div id="form-error"></div><form id="login-form"><div class="field"><label>Email</label><input required type="email" id="email" autocomplete="username"></div><div class="field"><label>Password</label><input required type="password" id="password" autocomplete="current-password"></div><button class="btn primary">Sign in</button></form><p class="hint">New to RaktaSetu? <button class="link" id="go-register">Create an account</button></p></section></main>'+footer()}
function requestView(){return '<main class="shell"><section class="card narrow"><button class="link" id="back-dash">← Dashboard</button><h2 class="title" style="margin-top:18px">Post a blood request</h2><p class="sub">All compatible donors within 20 km are alerted immediately. If an accepting donor does not confirm within 25 minutes, pending donors receive an escalation alert and newly eligible donors are notified.</p><div id="form-error"></div><form id="request-form"><div class="field"><label>Patient name</label><input required id="patient-name"></div><div class="row"><div class="field"><label>Blood group needed</label><select id="blood-needed">'+groupOptions()+'</select></div><div class="field"><label>Units</label><input type="number" id="units" value="1" min="1" max="100" required></div></div><div class="field"><label>Hospital / blood bank</label><input required id="hospital"></div><div class="row"><div class="field"><label>Urgency</label><select id="urgency"><option>Critical</option><option selected>High</option><option>Normal</option></select></div><div class="field"><label>Contact mobile</label><input required id="contact"></div></div>'+locFields('request')+'<button class="btn primary" style="margin-top:14px">Send blood request</button></form></section></main>'+footer()}
function statusTag(s){return '<span class="status status-'+esc(s)+'">'+esc(s)+'</span>'}
function dashboardView(){const a=state.account;if(!a)return loginView();if(a.role==='donor'||a.role==='nss_volunteer'){const profile=a.donor||{};const alerts=state.items;const pending=alerts.filter(x=>x.status==='pending'),other=alerts.filter(x=>x.status!=='pending');return '<main class="shell"><section class="card"><div class="section" style="margin:0"><div><h2>'+esc(a.name)+'</h2><p class="sub" style="margin:6px 0 0">'+esc(profile.blood_group||'')+' · '+esc(profile.location_name||'')+' · '+roleName(a.role)+'</p></div><button id="availability" class="btn '+(profile.available?'accept':'ghost')+' small">'+(profile.available?'● Available':'Paused')+'</button></div></section><div class="section"><h2>Active alerts</h2><span class="badge">'+pending.length+' pending</span></div>'+(pending.length?pending.map(alertCard).join(''):'<div class="empty">No new alerts right now. This page refreshes automatically.</div>')+(other.length?'<div class="section"><h2>Alert history</h2></div>'+other.map(alertCard).join(''):'')+'</main>'+footer()}
const reqs=state.items;return '<main class="shell"><div class="section"><div><h2>Welcome, '+esc(a.name.split(' ')[0])+'</h2><p class="sub" style="margin:5px 0 0">'+roleName(a.role)+' account · your requests and responses</p></div><button class="btn primary small" id="new-request">+ New request</button></div>'+(reqs.length?reqs.map(r=>'<article class="alert"><div><strong>'+esc(r.patient_name)+' · '+esc(r.blood_group_needed)+' · '+esc(r.hospital_name)+'</strong><div class="meta">Request #'+r.id+' · '+new Date(r.created_at).toLocaleString()+'</div></div><div style="display:flex;gap:9px;align-items:center">'+statusTag(r.status)+'<button class="btn ghost small" data-open-request="'+r.id+'">View responses</button></div></article>').join(''):'<div class="empty">No requests posted yet.</div>')+'</main>'+footer()}
function alertCard(a){let actions='';if(a.status==='pending')actions='<button class="btn accept small" data-action="accept" data-id="'+a.id+'">Accept request</button><button class="btn reject small" data-action="decline" data-id="'+a.id+'">Decline</button>';if(a.status==='accepted')actions='<button class="btn accept small" data-action="confirm" data-id="'+a.id+'">Confirm I’m on the way</button><span class="hint">Next donors will be alerted if not confirmed within 25 minutes.</span>';return '<article class="alert"><div><strong>'+esc(a.patient_name)+' needs '+esc(a.blood_group_needed)+' blood</strong> '+(a.urgency?'<span class="badge">'+esc(a.urgency)+'</span>':'')+'<div class="meta">'+esc(a.hospital_name)+' · '+esc(a.location_name)+' · '+esc(a.distance_km)+' km away · Contact '+esc(a.contact_mobile||'')+'</div></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+statusTag(a.status)+actions+'</div></article>'}
function resultsView(){const data=state.results;if(!data)return '<main class="shell"><div class="empty">Loading request…</div></main>';const list=data.alerts||[];return '<main class="shell"><div class="section"><div><span class="eyebrow">Request #'+data.request.id+'</span><h2>Donor responses</h2><p class="sub">'+esc(data.request.blood_group_needed)+' needed · '+esc(data.request.hospital_name)+' · '+statusTag(data.request.status)+'</p></div><button class="btn ghost small" id="dashboard">Dashboard</button></div>'+(list.length?list.map(a=>'<article class="alert"><div><strong>'+esc(a.donor_name)+' · '+esc(a.blood_group)+'</strong><div class="meta">'+(a.status==='accepted'||a.status==='confirmed'?'Contact: '+esc(a.donor_mobile):'Contact is shared only after a donor accepts')+' · '+esc(a.distance_km)+' km away</div></div>'+statusTag(a.status)+'</article>').join(''):'<div class="empty">No donor has been notified yet within 20 km. The system is still searching.</div>')+'<p class="hint">This page refreshes automatically. Accepted donors have 25 minutes to confirm they are on the way; otherwise the next donors are alerted.</p></main>'+footer()}
async function loadNotifications(){if(!state.account)return;try{const data=await api('/api/notifications');state.notices=data.items||[]}catch{}}
async function loadDashboard(){if(!state.account)return;if(state.account.role==='donor'||state.account.role==='nss_volunteer'){state.items=await api('/api/donor/alerts')}else{state.items=await api('/api/my/requests')}}
async function render(){stopPoll();const app=document.getElementById('app');try{if(state.account)await loadNotifications();if(state.view==='dashboard'&&state.account)await loadDashboard();if(state.view==='results'&&state.requestId)state.results=await api('/api/requests/'+state.requestId+'/alerts')}catch(e){state.error=e.message}let body=state.view==='home'?homeView():state.view==='register'?registerView():state.view==='login'?loginView():state.view==='request'?requestView():state.view==='dashboard'?dashboardView():state.view==='results'?resultsView():homeView();app.innerHTML=nav()+body;bind();if(state.view==='dashboard'||state.view==='results'){poll=setInterval(async()=>{try{if(state.view==='dashboard')await loadDashboard();if(state.view==='results'&&state.requestId)state.results=await api('/api/requests/'+state.requestId+'/alerts');await loadNotifications();await renderNoPoll()}catch{}},5000)}}
async function renderNoPoll(){const app=document.getElementById('app');const old=state.view;let body=old==='dashboard'?dashboardView():old==='results'?resultsView():'';if(body){app.innerHTML=nav()+body;bind()}}
function showError(id,e){const el=document.getElementById(id);if(el)el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
function bind(){const home=document.getElementById('home');if(home)home.onclick=()=>{state.view='home';state.noticeOpen=false;render()};document.querySelectorAll('[data-home]').forEach(x=>x.onclick=()=>{state.view='home';render()});const log=document.getElementById('login');if(log)log.onclick=()=>{state.view='login';render()};const reg=document.getElementById('register');if(reg)reg.onclick=()=>{state.view='register';render()};const dash=document.getElementById('dashboard');if(dash)dash.onclick=()=>{state.view='dashboard';render()};const note=document.getElementById('notify');if(note)note.onclick=()=>{state.noticeOpen=!state.noticeOpen;render()};const out=document.getElementById('logout');if(out)out.onclick=async()=>{await api('/api/logout',{method:'POST'});state.account=null;state.items=[];state.notices=[];state.view='home';render()};document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{state.view=x.dataset.go==='request'?(state.account&&['patient','blood_bank'].includes(state.account.role)?'request':'login'):x.dataset.go;render()});document.querySelectorAll('[data-note]').forEach(x=>x.onclick=async()=>{try{await api('/api/notifications/'+x.dataset.note+'/read',{method:'POST'});await loadNotifications();render()}catch{}});const role=document.getElementById('role');if(role)role.onchange=()=>{const donor=['donor','nss_volunteer'].includes(role.value);const box=document.getElementById('donor-fields');box.classList.toggle('hidden',!donor);box.querySelectorAll('[required]').forEach(el=>el.required=donor)};const city=document.getElementById('reg-city');if(city)bindLoc('reg');if(document.getElementById('request-city'))bindLoc('request');const lreg=document.getElementById('go-register');if(lreg)lreg.onclick=()=>{state.view='register';render()};const lf=document.getElementById('login-form');if(lf)lf.onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});state.account=r.account;state.view='dashboard';await render()}catch(err){showError('form-error',err)}};const rf=document.getElementById('reg-form');if(rf)rf.onsubmit=async e=>{e.preventDefault();const roleVal=document.getElementById('role').value;const data={name:document.getElementById('name').value,email:document.getElementById('email').value,mobile:document.getElementById('mobile').value,password:document.getElementById('password').value,role:roleVal};if(['donor','nss_volunteer'].includes(roleVal)){data.blood_group=document.getElementById('blood').value;data.platelet_count=document.getElementById('platelet').value;data.location_name=document.getElementById('reg-loc').value;data.latitude=document.getElementById('reg-lat').value;data.longitude=document.getElementById('reg-lng').value}try{const r=await api('/api/register',{method:'POST',body:JSON.stringify(data)});state.account=r.account;state.view='dashboard';await render()}catch(err){showError('form-error',err)}};const request=document.getElementById('new-request');if(request)request.onclick=()=>{state.view='request';render()};const back=document.getElementById('back-dash');if(back)back.onclick=()=>{state.view='dashboard';render()};const form=document.getElementById('request-form');if(form)form.onsubmit=async e=>{e.preventDefault();const data={patient_name:document.getElementById('patient-name').value,blood_group_needed:document.getElementById('blood-needed').value,units_needed:document.getElementById('units').value,hospital_name:document.getElementById('hospital').value,urgency:document.getElementById('urgency').value,contact_mobile:document.getElementById('contact').value,location_name:document.getElementById('request-loc').value,latitude:document.getElementById('request-lat').value,longitude:document.getElementById('request-lng').value};try{const r=await api('/api/requests',{method:'POST',body:JSON.stringify(data)});state.requestId=r.request_id;state.view='results';await render()}catch(err){showError('form-error',err)}};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{await api('/api/alerts/'+b.dataset.id+'/respond',{method:'POST',body:JSON.stringify({action:b.dataset.action})});await render()}catch(e){alert(e.message)}});const avail=document.getElementById('availability');if(avail)avail.onclick=async()=>{const next=!state.account.donor.available;try{const r=await api('/api/donor/availability',{method:'PUT',body:JSON.stringify({available:next})});state.account.donor.available=r.available;await render()}catch(e){alert(e.message)}};document.querySelectorAll('[data-open-request]').forEach(b=>b.onclick=()=>{state.requestId=b.dataset.openRequest;state.view='results';render()})}
