<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RaktaSetu — NSS Blood Donor Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14161F; --ink-soft: #454A5E; --blood: #B21030; --pulse: #FF4B5C;
    --paper: #F4F5F9; --panel: #FFFFFF; --line: #DCDFE8;
    --success: #1E7A4C; --success-soft: #E4F5EC; --muted: #767C93; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: 'Space Grotesk', system-ui, sans-serif; letter-spacing: -0.01em; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  input, select { font-family: inherit; }
  .shell { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  .topbar { border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 10; }
  .topbar-inner { max-width: 960px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--blood); display: flex; align-items: center; justify-content: center; color: white; font-size: 15px; }
  .brand-name { font-size: 18px; font-weight: 700; }
  .brand-sub { font-size: 11px; color: var(--muted); margin-top: -2px; }
  .nav-link { background: none; border: none; color: var(--ink-soft); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; }
  .nav-link:hover { background: var(--paper); }
  .heartbeat-wrap { width: 100%; overflow: hidden; height: 46px; margin: 6px 0 28px; }
  .heartbeat-line { width: 200%; height: 46px; stroke: var(--blood); stroke-width: 2; fill: none; animation: beat-scroll 5.5s linear infinite; }
  @keyframes beat-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .hero { padding: 56px 0 40px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: var(--blood); text-transform: uppercase; letter-spacing: 0.08em; }
  .eyebrow-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pulse); animation: dotpulse 1.4s ease-in-out infinite; }
  @keyframes dotpulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(1.4);} }
  .hero h1 { font-size: 42px; line-height: 1.08; margin-top: 14px; max-width: 620px; }
  .hero p.lead { color: var(--ink-soft); font-size: 16px; max-width: 520px; margin-top: 14px; line-height: 1.55; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 34px; }
  @media (max-width: 640px) { .role-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 32px; } }
  .role-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; text-align: left; transition: border-color .15s, transform .15s; cursor: pointer; }
  .role-card:hover { border-color: var(--blood); transform: translateY(-2px); }
  .role-card .tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .role-card h3 { font-size: 20px; margin-top: 8px; }
  .role-card p { color: var(--ink-soft); font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .role-card .go { margin-top: 16px; font-weight: 700; color: var(--blood); font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; margin-bottom: 20px; }
  .panel-title { font-size: 20px; margin-bottom: 4px; }
  .panel-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; background: var(--paper); color: var(--ink); }
  .field input:focus, .field select:focus { outline: 2px solid var(--blood); outline-offset: 1px; border-color: var(--blood); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 9px; border: none; font-weight: 700; font-size: 14px; }
  .btn-primary { background: var(--blood); color: white; width: 100%; }
  .btn-primary:hover { background: #8f0d26; }
  .btn-ghost { background: none; border: 1px solid var(--line); color: var(--ink); }
  .btn-accept { background: var(--success); color: white; }
  .btn-decline { background: none; border: 1px solid var(--line); color: var(--ink-soft); }
  .btn-small { padding: 8px 14px; font-size: 13px; }
  .error-msg { background: #FCE9EA; border: 1px solid #F1B4BB; color: var(--blood); padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; }
  .radar-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 0 10px; }
  .radar { position: relative; width: 160px; height: 160px; }
  .radar-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--blood); opacity: 0; animation: radar-pulse 2.4s ease-out infinite; }
  .radar-ring.r2 { animation-delay: .8s; }
  .radar-ring.r3 { animation-delay: 1.6s; }
  @keyframes radar-pulse { 0% { transform: scale(.2); opacity: .85; } 100% { transform: scale(1); opacity: 0; } }
  .radar-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 54px; height: 54px; border-radius: 50%; background: var(--blood); display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; }
  .radar-caption { margin-top: 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-soft); text-align: center; }
  .alert-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 11px; margin-bottom: 10px; background: var(--panel); flex-wrap: wrap; }
  .alert-row.status-accepted { border-color: var(--success); background: var(--success-soft); }
  .alert-row.status-declined { opacity: .5; }
  .alert-main { display: flex; flex-direction: column; gap: 3px; }
  .alert-title { font-weight: 700; font-size: 14.5px; }
  .alert-meta { font-size: 12.5px; color: var(--muted); }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .badge-critical { background: #FCE9EA; color: var(--blood); }
  .badge-high { background: #FFF2DE; color: #A15C00; }
  .badge-normal { background: #EAF0FE; color: #2955C9; }
  .distance-chip { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
  .footer-note { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 50px; }
  .link-btn { background: none; border: none; color: var(--blood); font-weight: 700; font-size: 13px; padding: 0; }
</style>
</head>
<body>
<div id="root">
  <div class="shell" style="padding-top:60px;text-align:center;color:var(--muted)">Loading…</div>
</div>

<script>
/* =============================================================
   API — talks to the real Flask backend on this same server.
   Plain JavaScript, no React/Babel, so nothing needs to be
   transformed in the browser (avoids the Babel bug entirely).
   ============================================================= */
const api = {
  async registerDonor(data) {
    const res = await fetch("/api/donor/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Registration failed");
    return body;
  },
  async loginDonor(mobile, password) {
    const res = await fetch("/api/donor/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mobile, password }) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Login failed");
    return body;
  },
  async setAvailability(donorId, available) {
    await fetch(`/api/donor/${donorId}/availability`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ available }) });
  },
  async createPatientRequest(data) {
    const res = await fetch("/api/patient/request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || "Could not post the request");
    return body;
  },
  async donorAlerts(donorId) {
    const res = await fetch(`/api/donor/${donorId}/alerts`);
    return res.json();
  },
  async patientAlerts(patientId) {
    const res = await fetch(`/api/patient/${patientId}/alerts`);
    return res.json();
  },
  async respondToAlert(alertId, response) {
    await fetch(`/api/alert/${alertId}/respond`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ response }) });
  },
};

/* =============================================================
   Reference data
   ============================================================= */
const BLOOD_GROUPS = ["O-", "O+", "A-", "A+", "B-", "B+", "AB-", "AB+"];
const PRESET_CITIES = [
  { name: "Warangal, Telangana", lat: 17.9689, lng: 79.5941 },
  { name: "Hanamkonda, Telangana", lat: 18.0002, lng: 79.5800 },
  { name: "Hyderabad, Telangana", lat: 17.3850, lng: 78.4867 },
  { name: "Khammam, Telangana", lat: 17.2473, lng: 80.1514 },
  { name: "Karimnagar, Telangana", lat: 18.4386, lng: 79.1288 },
  { name: "Nizamabad, Telangana", lat: 18.6725, lng: 78.0941 },
  { name: "Vijayawada, AP", lat: 16.5062, lng: 80.6480 },
  { name: "Bengaluru, Karnataka", lat: 12.9716, lng: 77.5946 },
];

/* =============================================================
   App state + tiny render loop (no framework)
   ============================================================= */
const state = { view: "landing", donor: null, patientId: null };
let pollTimer = null;

function go(view) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  state.view = view;
  render();
}

function esc(s) { const d = document.createElement("div"); d.innerText = (s ?? ""); return d.innerHTML; }
function cityOptions() { return PRESET_CITIES.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join(""); }
function bloodOptions(selected) { return BLOOD_GROUPS.map(g => `<option value="${g}" ${g === selected ? "selected" : ""}>${g}</option>`).join(""); }
function urgencyBadge(level) {
  const cls = level === "Critical" ? "badge-critical" : level === "Normal" ? "badge-normal" : "badge-high";
  return `<span class="badge ${cls}">${esc(level)}</span>`;
}

function topBarHtml() {
  return `
  <div class="topbar"><div class="topbar-inner">
    <div class="brand" id="brand-home">
      <div class="brand-mark">🩸</div>
      <div><div class="brand-name">RaktaSetu</div><div class="brand-sub">NSS Blood Donor Network</div></div>
    </div>
    <div>${state.donor ? `<button class="nav-link" id="go-dashboard">Hi, ${esc(state.donor.name.split(" ")[0])} →</button>` : `<button class="nav-link" id="go-login">Donor login</button>`}</div>
  </div></div>`;
}
function heartbeatHtml() {
  const path = "M0,23 L60,23 L75,23 L85,4 L95,42 L105,23 L120,23 L400,23 L460,23 L475,23 L485,4 L495,42 L505,23 L520,23 L800,23";
  return `<div class="heartbeat-wrap"><svg class="heartbeat-line" viewBox="0 0 800 46" preserveAspectRatio="none"><path d="${path}" /></svg></div>`;
}

/* ---------------- LANDING ---------------- */
function renderLanding() {
  return `
  <div class="shell hero">
    <span class="eyebrow"><span class="eyebrow-dot"></span> Live matching · 30 km radius</span>
    <h1>Bridging blood donors to patients who need them, right now.</h1>
    <p class="lead">NSS volunteers and registered donors list their blood group and location once. When a patient's hospital posts an emergency requirement, every compatible donor within 30 km is alerted instantly to respond.</p>
    ${heartbeatHtml()}
    <div class="role-grid">
      <div class="role-card" id="card-donor">
        <div class="tag">Step 01 — Donor / NSS Volunteer</div><h3>Register as a donor</h3>
        <p>Share your blood group, platelet count and location once. Get alerted only when someone nearby genuinely needs your group.</p>
        <div class="go">Register →</div>
      </div>
      <div class="role-card" id="card-patient">
        <div class="tag">Step 02 — Patient / Hospital</div><h3>Request blood urgently</h3>
        <p>Post the blood group, hospital and location. Compatible donors within 30 km are alerted immediately.</p>
        <div class="go">Raise a request →</div>
      </div>
    </div>
    <p class="footer-note">Already registered as a donor? <button class="link-btn" id="link-login">Log in here</button></p>
  </div>`;
}
function bindLanding() {
  document.getElementById("card-donor").onclick = () => go("donorRegister");
  document.getElementById("card-patient").onclick = () => go("patientRequest");
  document.getElementById("link-login").onclick = () => go("donorLogin");
}

/* ---------------- LOCATION PICKER ---------------- */
function locationPickerHtml(prefix) {
  return `
    <div class="field">
      <label>Location</label>
      <select id="${prefix}-city">
        <option value="" disabled selected>Pick a nearby city (or enter manually below)</option>
        ${cityOptions()}
      </select>
    </div>
    <div class="field-row">
      <div class="field"><label>Location name</label><input id="${prefix}-locname" placeholder="Area / landmark" /></div>
      <div class="field"><label>&nbsp;</label><button type="button" class="btn btn-ghost" style="width:100%" id="${prefix}-geo">📍 Use my current location</button></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Latitude</label><input type="number" step="0.0001" id="${prefix}-lat" placeholder="17.9689" /></div>
      <div class="field"><label>Longitude</label><input type="number" step="0.0001" id="${prefix}-lng" placeholder="79.5941" /></div>
    </div>
    <p class="hint">Matching only alerts donors within 30 km of this point.</p>`;
}
function bindLocationPicker(prefix) {
  document.getElementById(`${prefix}-city`).onchange = (e) => {
    const city = PRESET_CITIES.find(c => c.name === e.target.value);
    if (city) {
      document.getElementById(`${prefix}-locname`).value = city.name;
      document.getElementById(`${prefix}-lat`).value = city.lat;
      document.getElementById(`${prefix}-lng`).value = city.lng;
    }
  };
  document.getElementById(`${prefix}-geo`).onclick = () => {
    if (!navigator.geolocation) return;
    const btn = document.getElementById(`${prefix}-geo`);
    btn.innerText = "Locating…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById(`${prefix}-lat`).value = pos.coords.latitude.toFixed(4);
        document.getElementById(`${prefix}-lng`).value = pos.coords.longitude.toFixed(4);
        const nameEl = document.getElementById(`${prefix}-locname`);
        if (!nameEl.value) nameEl.value = "Current location";
        btn.innerText = "📍 Use my current location";
      },
      () => { btn.innerText = "📍 Use my current location"; }
    );
  };
}
function readLocation(prefix) {
  return {
    location_name: document.getElementById(`${prefix}-locname`).value.trim(),
    latitude: parseFloat(document.getElementById(`${prefix}-lat`).value),
    longitude: parseFloat(document.getElementById(`${prefix}-lng`).value),
  };
}

/* ---------------- DONOR REGISTER ---------------- */
function renderDonorRegister() {
  return `
  <div class="shell" style="padding-top:36px;max-width:560px">
    <button class="link-btn" id="back-landing">← Back</button>
    <div class="panel" style="margin-top:16px">
      <h2 class="panel-title">Register as a donor</h2>
      <p class="panel-sub">Takes under a minute. You'll only be alerted for genuine, compatible, nearby emergencies.</p>
      <div id="reg-error"></div>
      <form id="reg-form">
        <div class="field"><label>Full name</label><input required id="reg-name" placeholder="G. Gowtham" /></div>
        <div class="field-row">
          <div class="field"><label>Mobile number</label><input required id="reg-mobile" placeholder="9876543210" /></div>
          <div class="field"><label>Email (optional)</label><input type="email" id="reg-email" placeholder="you@example.com" /></div>
        </div>
        <div class="field"><label>Password</label><input required type="password" id="reg-password" placeholder="Choose a password" /></div>
        <div class="field-row">
          <div class="field"><label>Blood group</label><select id="reg-blood">${bloodOptions("O+")}</select></div>
          <div class="field"><label>Platelet count (optional)</label><input id="reg-platelet" placeholder="e.g. 250000" /></div>
        </div>
        <div class="field" style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" style="width:auto" id="reg-nss" />
          <label for="reg-nss" style="margin:0;text-transform:none;font-size:14px;font-weight:500">I'm registering as an NSS volunteer</label>
        </div>
        ${locationPickerHtml("reg")}
        <button class="btn btn-primary" style="margin-top:6px">Register & continue</button>
      </form>
    </div>
  </div>`;
}
function bindDonorRegister() {
  document.getElementById("back-landing").onclick = () => go("landing");
  bindLocationPicker("reg");
  document.getElementById("reg-form").onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("reg-error"); errEl.innerHTML = "";
    const loc = readLocation("reg");
    if (!loc.location_name || isNaN(loc.latitude) || isNaN(loc.longitude)) {
      errEl.innerHTML = `<div class="error-msg">Please pick or enter your location.</div>`; return;
    }
    const form = {
      name: document.getElementById("reg-name").value.trim(),
      mobile: document.getElementById("reg-mobile").value.trim(),
      email: document.getElementById("reg-email").value.trim(),
      password: document.getElementById("reg-password").value,
      blood_group: document.getElementById("reg-blood").value,
      platelet_count: document.getElementById("reg-platelet").value,
      is_nss_volunteer: document.getElementById("reg-nss").checked,
    };
    if (!form.name || !form.mobile || !form.password) {
      errEl.innerHTML = `<div class="error-msg">Please fill all required fields.</div>`; return;
    }
    try {
      await api.registerDonor({ ...form, ...loc });
      const donor = await api.loginDonor(form.mobile, form.password);
      state.donor = donor;
      go("donorDashboard");
    } catch (err) {
      errEl.innerHTML = `<div class="error-msg">${esc(err.message)}</div>`;
    }
  };
}

/* ---------------- DONOR LOGIN ---------------- */
function renderDonorLogin() {
  return `
  <div class="shell" style="padding-top:36px;max-width:420px">
    <button class="link-btn" id="back-landing">← Back</button>
    <div class="panel" style="margin-top:16px">
      <h2 class="panel-title">Donor login</h2>
      <p class="panel-sub">Log in to see and respond to alerts near you.</p>
      <div id="login-error"></div>
      <form id="login-form">
        <div class="field"><label>Mobile number</label><input required id="login-mobile" /></div>
        <div class="field"><label>Password</label><input required type="password" id="login-password" /></div>
        <button class="btn btn-primary">Log in</button>
      </form>
      <p class="footer-note" style="padding-bottom:0">New here? <button class="link-btn" id="link-register">Register as a donor</button></p>
    </div>
  </div>`;
}
function bindDonorLogin() {
  document.getElementById("back-landing").onclick = () => go("landing");
  document.getElementById("link-register").onclick = () => go("donorRegister");
  document.getElementById("login-form").onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("login-error"); errEl.innerHTML = "";
    try {
      const donor = await api.loginDonor(document.getElementById("login-mobile").value.trim(), document.getElementById("login-password").value);
      state.donor = donor;
      go("donorDashboard");
    } catch (err) {
      errEl.innerHTML = `<div class="error-msg">${esc(err.message)}</div>`;
    }
  };
}

/* ---------------- DONOR DASHBOARD ---------------- */
async function renderDonorDashboardAsync() {
  if (!state.donor) {
    return `<div class="shell" style="padding-top:60px;text-align:center"><p>You need to log in first.</p><button class="btn btn-primary" style="width:auto" id="go-login-2">Go to login</button></div>`;
  }
  const d = state.donor;
  const alerts = await api.donorAlerts(d.id);
  const pending = alerts.filter(a => a.status === "pending");
  const past = alerts.filter(a => a.status !== "pending");

  const pendingHtml = pending.length === 0
    ? `<div class="panel empty-state">No active emergencies matched to you right now. This page checks automatically every few seconds.</div>`
    : pending.map(a => `
      <div class="alert-row" data-id="${a.id}">
        <div class="alert-main"><div class="alert-title">${esc(a.patient_name)} needs ${esc(a.blood_group_needed)} ${urgencyBadge(a.urgency)}</div>
        <div class="alert-meta">${esc(a.hospital_name)} · ${esc(a.location_name)} · Contact: ${esc(a.contact_mobile)}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="distance-chip">${a.distance_km} km</span>
          <button class="btn btn-small btn-accept" data-action="accept" data-id="${a.id}">Accept</button>
          <button class="btn btn-small btn-decline" data-action="decline" data-id="${a.id}">Decline</button>
        </div>
      </div>`).join("");

  const pastHtml = past.length === 0 ? "" : `<h3 style="margin:24px 0 12px">History</h3>` + past.map(a => `
    <div class="alert-row status-${a.status}">
      <div class="alert-main"><div class="alert-title">${esc(a.patient_name)} · ${esc(a.blood_group_needed)}</div><div class="alert-meta">${esc(a.hospital_name)} · ${a.status}</div></div>
      <span class="distance-chip">${a.distance_km} km</span>
    </div>`).join("");

  return `
  <div class="shell" style="padding-top:30px;max-width:640px">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><h2 class="panel-title">${esc(d.name)}</h2><p class="panel-sub" style="margin-bottom:0">${esc(d.blood_group)} · ${esc(d.location_name)} ${d.is_nss_volunteer ? "· NSS Volunteer" : ""}</p></div>
        <button class="btn btn-small ${d.available ? "btn-accept" : "btn-ghost"}" id="toggle-available">${d.available ? "● Available" : "Paused"}</button>
      </div>
    </div>
    <h3 style="margin-bottom:12px">Pending alerts ${pending.length > 0 ? `<span class="badge badge-critical">${pending.length}</span>` : ""}</h3>
    ${pendingHtml}
    ${pastHtml}
  </div>`;
}
function bindDonorDashboard() {
  if (!state.donor) { document.getElementById("go-login-2").onclick = () => go("donorLogin"); return; }
  const toggleBtn = document.getElementById("toggle-available");
  if (toggleBtn) toggleBtn.onclick = async () => {
    const next = !state.donor.available;
    await api.setAvailability(state.donor.id, next);
    state.donor.available = next ? 1 : 0;
    renderAsync();
  };
  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = async () => {
      await api.respondToAlert(parseInt(btn.dataset.id), btn.dataset.action === "accept" ? "accepted" : "declined");
      renderAsync();
    };
  });
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (state.view === "donorDashboard") renderAsync(); }, 4000);
}

/* ---------------- PATIENT REQUEST ---------------- */
function renderPatientRequest() {
  return `
  <div class="shell" style="padding-top:36px;max-width:560px">
    <button class="link-btn" id="back-landing">← Back</button>
    <div class="panel" style="margin-top:16px">
      <h2 class="panel-title">Post an emergency blood requirement</h2>
      <p class="panel-sub">Every compatible, available donor within 30 km is alerted the moment you submit this.</p>
      <div id="pr-error"></div>
      <form id="pr-form">
        <div class="field"><label>Patient name</label><input required id="pr-name" /></div>
        <div class="field-row">
          <div class="field"><label>Blood group needed</label><select id="pr-blood">${bloodOptions("O+")}</select></div>
          <div class="field"><label>Units needed</label><input type="number" min="1" value="1" id="pr-units" /></div>
        </div>
        <div class="field"><label>Hospital name</label><input required id="pr-hospital" placeholder="MGM Hospital, Warangal" /></div>
        <div class="field-row">
          <div class="field"><label>Urgency</label><select id="pr-urgency"><option>Critical</option><option>High</option><option>Normal</option></select></div>
          <div class="field"><label>Contact mobile</label><input required id="pr-contact" placeholder="Attendant's number" /></div>
        </div>
        ${locationPickerHtml("pr")}
        <button class="btn btn-primary" style="margin-top:6px">Send emergency alert</button>
      </form>
    </div>
  </div>`;
}
function bindPatientRequest() {
  document.getElementById("back-landing").onclick = () => go("landing");
  bindLocationPicker("pr");
  document.getElementById("pr-form").onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("pr-error"); errEl.innerHTML = "";
    const loc = readLocation("pr");
    if (!loc.location_name || isNaN(loc.latitude) || isNaN(loc.longitude)) {
      errEl.innerHTML = `<div class="error-msg">Please pick or enter the hospital's location.</div>`; return;
    }
    const form = {
      patient_name: document.getElementById("pr-name").value.trim(),
      blood_group_needed: document.getElementById("pr-blood").value,
      units_needed: parseInt(document.getElementById("pr-units").value) || 1,
      hospital_name: document.getElementById("pr-hospital").value.trim(),
      urgency: document.getElementById("pr-urgency").value,
      contact_mobile: document.getElementById("pr-contact").value.trim(),
    };
    if (!form.patient_name || !form.hospital_name || !form.contact_mobile) {
      errEl.innerHTML = `<div class="error-msg">Please fill all required fields.</div>`; return;
    }
    try {
      const result = await api.createPatientRequest({ ...form, ...loc });
      state.patientId = result.patient_id;
      go("patientResults");
    } catch (err) {
      errEl.innerHTML = `<div class="error-msg">${esc(err.message)}</div>`;
    }
  };
}

/* ---------------- PATIENT RESULTS ---------------- */
async function renderPatientResultsAsync() {
  if (!state.patientId) {
    return `<div class="shell" style="padding-top:60px;text-align:center"><p>No active request found.</p><button class="btn btn-primary" style="width:auto" id="go-request-2">Post a request</button></div>`;
  }
  const alerts = await api.patientAlerts(state.patientId);
  const accepted = alerts.filter(a => a.status === "accepted");

  const acceptedHtml = accepted.length === 0 ? "" : `
    <div class="panel" style="border-color:var(--success)">
      <h3 style="color:var(--success);margin-bottom:10px">✓ ${accepted.length} donor${accepted.length > 1 ? "s" : ""} accepted</h3>
      ${accepted.map(a => `
        <div class="alert-row status-accepted">
          <div class="alert-main"><div class="alert-title">${esc(a.donor_name)} (${esc(a.blood_group)}${a.is_nss_volunteer ? " · NSS" : ""})</div><div class="alert-meta">Contact: ${esc(a.donor_mobile)}</div></div>
          <span class="distance-chip">${a.distance_km} km away</span>
        </div>`).join("")}
    </div>`;

  const listHtml = alerts.length === 0
    ? `<div class="panel empty-state">No compatible donors are currently registered within 30 km of this hospital.</div>`
    : alerts.map(a => `
      <div class="alert-row status-${a.status}">
        <div class="alert-main"><div class="alert-title">${esc(a.donor_name)} · ${esc(a.blood_group)}</div><div class="alert-meta">Status: ${a.status}</div></div>
        <span class="distance-chip">${a.distance_km} km</span>
      </div>`).join("");

  return `
  <div class="shell" style="padding-top:30px;max-width:620px">
    <div class="panel">
      <div class="radar-wrap">
        <div class="radar"><div class="radar-ring"></div><div class="radar-ring r2"></div><div class="radar-ring r3"></div><div class="radar-center">🩸</div></div>
        <div class="radar-caption">${alerts.length} matching donor(s) alerted within 30 km</div>
      </div>
    </div>
    ${acceptedHtml}
    <h3 style="margin:20px 0 12px">All alerted donors</h3>
    ${listHtml}
    <p class="footer-note">This page refreshes automatically as donors respond.</p>
  </div>`;
}
function bindPatientResults() {
  if (!state.patientId) { document.getElementById("go-request-2").onclick = () => go("patientRequest"); return; }
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (state.view === "patientResults") renderAsync(); }, 3000);
}

/* ---------------- ROOT RENDER ---------------- */
async function renderAsync() {
  const root = document.getElementById("root");
  let content = "";
  if (state.view === "landing") content = renderLanding();
  else if (state.view === "donorRegister") content = renderDonorRegister();
  else if (state.view === "donorLogin") content = renderDonorLogin();
  else if (state.view === "donorDashboard") content = await renderDonorDashboardAsync();
  else if (state.view === "patientRequest") content = renderPatientRequest();
  else if (state.view === "patientResults") content = await renderPatientResultsAsync();

  root.innerHTML = topBarHtml() + content;

  document.getElementById("brand-home").onclick = () => go("landing");
  const goLogin = document.getElementById("go-login"); if (goLogin) goLogin.onclick = () => go("donorLogin");
  const goDash = document.getElementById("go-dashboard"); if (goDash) goDash.onclick = () => go("donorDashboard");

  if (state.view === "landing") bindLanding();
  else if (state.view === "donorRegister") bindDonorRegister();
  else if (state.view === "donorLogin") bindDonorLogin();
  else if (state.view === "donorDashboard") bindDonorDashboard();
  else if (state.view === "patientRequest") bindPatientRequest();
  else if (state.view === "patientResults") bindPatientResults();
}
function render() { renderAsync(); }

render();
</script>
</body>
</html>
